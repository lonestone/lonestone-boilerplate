packages:
  - packages/*
  - apps/*
  - .boilerstone
strictPeerDependencies: true
# tsconfck (via vite-tsconfig-paths) still declares typescript@^5; TS 6 is compatible here
peerDependencyRules:
  allowedVersions:
    typescript: '6'
# cookie@1 keeps Express (parse/serialize) and Astro <=7.1.1 (parseCookie) compatible under shamefully-hoist
overrides:
  cookie: 1.1.1
# We override dependencies here to ensure that the correct version of the dependency is used for each package
catalogs:
  auth:
    better-auth: ^1.6.25
  build:
    '@types/node': ^25.9.5
    typescript: ^6.0.3
    vite: ^7.3.6
    vite-tsconfig-paths: ^6.1.1
  frontend:
    '@hookform/resolvers': ^5.7.1
    '@react-router/dev': ^8.3.0
    '@react-router/node': ^8.3.0
    '@react-router/serve': ^8.3.0
    '@tailwindcss/vite': ^4.3.3
    '@tanstack/react-query': ^5.101.4
    '@types/react': ^19.2.18
    '@types/react-dom': ^19.2.4
    i18next: ^25.10.10
    react: ^19.2.8
    react-dom: ^19.2.8
    react-hook-form: ^7.84.0
    react-i18next: ^16.6.6
    react-router: ^8.3.0
    tailwind-merge: ^3.6.0
    tailwindcss: ^4.3.3
    tailwindcss-animate: ^1.0.7
  validation:
    zod: ~4.3.6
    zod-openapi: 5.4.6

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@scarf/scarf'
  - '@tailwindcss/oxide'
  - cpu-features
  - esbuild
  - lefthook
  - nestjs-pino
  - protobufjs
  - sharp
  - ssh2
  - unrs-resolver
