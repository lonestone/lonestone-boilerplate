packages:
  - packages/*
  - apps/*
  # Upgrade tooling; safe to delete the directory to detach from the boilerplate
  - .boilerstone
strictPeerDependencies: true
# We override dependencies here to ensure that the correct version of the dependency is used for each package
catalogs:
  auth:
    better-auth: ^1.6.23
  build:
    '@types/node': ^25.9.4
    typescript: ^6.0.3
    vite: ^7.3.6
    vite-tsconfig-paths: ^6.1.1
  frontend:
    '@hookform/resolvers': ^5.4.0
    '@react-router/dev': ^7.18.1
    '@react-router/node': ^7.18.1
    '@react-router/serve': ^7.18.1
    '@tailwindcss/vite': ^4.3.2
    '@tanstack/react-query': ^5.101.2
    '@types/react': ^19.2.17
    '@types/react-dom': ^19.2.3
    i18next: ^25.10.10
    react: ^19.2.7
    react-dom: ^19.2.7
    react-hook-form: ^7.80.0
    react-i18next: ^16.6.6
    react-router: ^7.18.1
    tailwind-merge: ^3.6.0
    tailwindcss: ^4.3.2
    tailwindcss-animate: ^1.0.7
  validation:
    zod: ~4.3.6
    zod-openapi: 5.4.6

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@scarf/scarf'
  - '@tailwindcss/oxide'
  - cpu-features
  - esbuild
  - nestjs-pino
  - protobufjs
  - sharp
  - ssh2
  - unrs-resolver
