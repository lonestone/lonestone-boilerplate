name: Intention gate

# Producer-only. Without .boilerstone/migration-intentions/ this is not the
# boilerplate repository and the job skips successfully. The rule is defined
# in .boilerstone/README.md ("Producer or consumer").

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  intention-gate:
    name: Intention gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect skip conditions
        id: gate
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [ ! -d .boilerstone/migration-intentions ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo ".boilerstone/migration-intentions/ does not exist on this branch, so this is not the boilerplate repository. No intention is required. Skipping."
            exit 0
          fi
          if [[ ",${LABELS}," == *",no-intention,"* ]]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Label no-intention present. Skipping."
            exit 0
          fi
          if [[ ",${LABELS}," == *",autorelease: pending,"* ]]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Release PR (autorelease: pending). Skipping."
            exit 0
          fi
          echo "required=true" >> "$GITHUB_OUTPUT"

      - name: Require a staged unreleased intention
        if: steps.gate.outputs.required == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          added="$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD")"
          found=0
          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            case "${file}" in
              .boilerstone/migration-intentions/unreleased/*.md)
                base="$(basename "${file}")"
                if [ "${base}" != "README.md" ] && [ "${base}" != "TEMPLATE.md" ]; then
                  echo "Found staged intention: ${file}"
                  found=1
                fi
                ;;
            esac
          done <<< "${added}"
          if [ "${found}" -eq 1 ]; then
            exit 0
          fi
          echo "add an intention under .boilerstone/migration-intentions/unreleased/ or apply the no-intention label"
          exit 1
