name: Release Please

on:
  push:
    branches:
      - main

# A human merges the Release PR from the GitHub UI as themselves.
# Do not auto-merge it. Green checks are not consent to ship.
# Do not merge with GITHUB_TOKEN — that merge does not start the follow-up
# run that creates the tag.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Open or update the Release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout the tagged commit
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Mirror the release note to the GitHub Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NOTE="apps/documentation/src/content/docs/releases/v${VERSION}.mdx"
          if [[ ! -f "$NOTE" ]]; then
            echo "add ${NOTE} before merging"
            exit 1
          fi
          NOTES_FILE="$(mktemp)"
          python3 - "$NOTE" "$NOTES_FILE" <<'PY'
          import re
          import sys

          source_path, dest_path = sys.argv[1], sys.argv[2]
          text = open(source_path, encoding="utf-8").read()
          body = re.sub(r"^---\r?\n[\s\S]*?\r?\n---\r?\n?", "", text, count=1)
          open(dest_path, "w", encoding="utf-8").write(body.strip() + "\n")
          PY
          {
            cat "$NOTES_FILE"
            echo
            echo "---"
            echo
            echo "To send this version to an environment, run the [Promote workflow](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/promote.yml). Pick \`staging\` or \`production\` and version \`${VERSION}\`."
          } > "${NOTES_FILE}.out"
          mv "${NOTES_FILE}.out" "$NOTES_FILE"
          gh release edit "$TAG" --notes-file "$NOTES_FILE"

  # Producer-only: generated projects keep this workflow but skip this job.
  # Same workflow run as the tag (GITHUB_TOKEN tag pushes do not start a
  # second workflow). Split from release-please so a failed publish can be
  # retried without running release-please again.
  publish-cli:
    name: Publish @lonestone/boilerstone-cli
    needs: release-please
    if: ${{ always() && !cancelled() && needs.release-please.outputs.release_created == 'true' && github.repository == 'lonestone/lonestone-boilerplate' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          # Lets npm read NODE_AUTH_TOKEN from the generated .npmrc.
          registry-url: https://registry.npmjs.org

      - name: Verify the CLI version matches the tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          CLI_VERSION="$(node -p "require('./.boilerstone/cli/package.json').version")"
          if [[ "$CLI_VERSION" != "$VERSION" ]]; then
            echo "CLI version ${CLI_VERSION} does not match tag ${TAG}"
            exit 1
          fi

      # No lifecycle scripts: this job can mint an OIDC token that npm trusts,
      # so no dependency may run code during the install.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # `--ignore-scripts` skips the CLI's `prepare` script, so build dist/ here.
      - name: Build the CLI
        run: pnpm --filter @lonestone/boilerstone-cli run build

      - name: Check the CLI is built
        run: test -f .boilerstone/cli/dist/bin.js

      - name: Publish @lonestone/boilerstone-cli
        run: pnpm --filter @lonestone/boilerstone-cli publish --access public --no-git-checks
        env:
          # npm only accepts a trusted publisher on a package that already
          # exists, so the first release publishes with this token. After
          # that, npm uses trusted publishing (id-token above) and the secret
          # can be deleted. See .boilerstone/docs/release-maintainer-runbook.md.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
