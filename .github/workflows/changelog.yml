name: Changelog 📜

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  check:
    name: 📜 Changelog entry
    # Escape hatch for PRs with no consumer-visible impact: label them `no-changelog`.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24.13.0
          pnpm-version: 10.28.2

      - name: 📚 Install dependencies
        run: pnpm install

      - name: 📜 Require a changelog entry for the diff
        run: pnpm boilerplate changelog check --base "origin/${{ github.base_ref }}"
