name: Build Docker to GHCR

on:
  push:
    branches: [main]
    tags: ['v*']
  # Rebuild the version images of a release by hand: pass its tag (v1.2.3).
  # Without a tag, it builds the branch or tag picked in "Use workflow from".
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild, for example v1.3.0. Leave empty to build the selected ref.
        type: string
        required: false
  # Called by release-please.yml once it has made a release. Release Please pushes
  # its tag with GITHUB_TOKEN, and GitHub starts no workflow for such a push.
  # A called workflow keeps the caller's github.ref (refs/heads/main), so everything
  # that depends on the release reads inputs.tag instead.
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, for example v1.3.0
        type: string
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Define the images to build, all the steps will be repeated for each line in the matrix
      matrix:
        include:
          - dockerfile: ./apps/api/Dockerfile
            image: ${{ github.repository }}-api
          - dockerfile: ./apps/web-spa/Dockerfile
            image: ${{ github.repository }}-web-spa
          - dockerfile: ./apps/web-ssr/Dockerfile
            image: ${{ github.repository }}-web-ssr

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Check the release tag
        if: env.RELEASE_TAG != ''
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must look like v1.2.3, got '${RELEASE_TAG}'"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Empty without inputs.tag: the event's default ref
          ref: ${{ inputs.tag }}

      # With inputs.tag, github.sha is the caller's commit, not the tag's.
      # Read the commit from the checkout so the revision label stays true.
      - name: Read the built commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Skip missing Dockerfile
        id: present
        run: |
          if [[ -f "${{ matrix.dockerfile }}" ]]; then
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "No ${{ matrix.dockerfile }}; skipping this image."
          fi

      - name: Log in to the Container registry
        if: steps.present.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        if: steps.present.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          flavor: |
            latest=false
          # The sha- tag comes from github.sha, which is not the built commit when
          # inputs.tag is set. The push on main already built that commit's sha- image.
          # Without inputs.tag, semver reads the pushed or selected tag, as before.
          tags: |
            type=sha,enable=${{ inputs.tag == '' }}
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      # For more information, see [Usage](https://github.com/docker/build-push-action#usage)
      - name: Build and push Docker image
        if: steps.present.outputs.skip != 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # This step generates an artifact attestation for the image, which is an unforgeable statement about where and how it was built.
      # It increases supply chain security for people who consume the image. For more information,
      # see [Using artifact attestations to establish provenance for builds](/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds).
      # DOES NOT WOKR ON PRIVATE REPOSITORIES
      # - name: Generate artifact attestation
      #   uses: actions/attest@v4
      #   with:
      #     subject-name: ${{ env.REGISTRY }}/${{ matrix.image }}
      #     subject-digest: ${{ steps.push.outputs.digest }}
      #     push-to-registry: true
