commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  follow: true
  jobs:
    - name: quality
      run: |
        echo "Running linter..."
        pnpm lint || exit 1
        echo "Running type check..."
        pnpm typecheck || exit 1
        echo "All pre-push checks passed!"
